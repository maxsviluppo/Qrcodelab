
<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Labs - Precision Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #020617;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      .bg-blue-informatica {
        background-color: #0047FF;
      }
      .text-blue-informatica {
        color: #0047FF;
      }
      .border-blue-informatica {
        border-color: #0047FF;
      }
      
      @keyframes float-3d {
        0%, 100% { transform: translateY(0px) rotateX(0deg); }
        50% { transform: translateY(-8px) rotateX(2deg); }
      }
      
      .neon-card {
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        perspective: 1000px;
      }
      
      .neon-glow-blue {
        box-shadow: 0 0 15px rgba(0, 71, 255, 0.1), 
                    inset 0 0 8px rgba(0, 71, 255, 0.05);
      }
      
      .neon-glow-blue-strong {
        box-shadow: 0 0 25px rgba(0, 71, 255, 0.4), 
                    0 0 50px rgba(0, 71, 255, 0.1),
                    inset 0 0 12px rgba(255, 255, 255, 0.1);
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      .glass-morphism {
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }

      .float-container {
        perspective: 1000px;
      }

      /* Futuristic Grid Background */
      .bg-grid {
        background-image: radial-gradient(circle at 2px 2px, rgba(0, 71, 255, 0.05) 1px, transparent 0);
        background-size: 32px 32px;
      }

      .scanline {
        width: 100%;
        height: 100px;
        z-index: 10;
        background: linear-gradient(0deg, rgba(0, 71, 255, 0) 0%, rgba(0, 71, 255, 0.05) 50%, rgba(0, 71, 255, 0) 100%);
        opacity: 0.1;
        position: fixed;
        bottom: 100%;
        animation: scanline 8s linear infinite;
      }

      @keyframes scanline {
        0% { bottom: 100%; }
        100% { bottom: -100px; }
      }

      @media print {
        body * {
          visibility: hidden;
          background: white !important;
        }
        #qr-print-area, #qr-print-area * {
          visibility: visible;
        }
        #qr-print-area {
          position: absolute;
          left: 50%;
          top: 50%;
          transform: translate(-50%, -50%);
          width: 300px !important;
          height: 300px !important;
          border: none !important;
          box-shadow: none !important;
        }
      }
    </style>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="bg-grid">
    <div class="scanline"></div>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
